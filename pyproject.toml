[project]
name = "anilist_export"
version = "1.0.0"
description = "Export your anilist to a excel spreadsheet."
requires-python = ">=3.9"
dependencies = [
	"aiohappyeyeballs==2.6.1",
	"aiohttp==3.13.2",
	"aiosignal==1.4.0",
	"attrs==25.4.0",
	"et_xmlfile==2.0.0",
	"frozenlist==1.8.0",
	"idna==3.11",
	"multidict==6.7.0",
	"openpyxl==3.1.5",
	"propcache==0.4.1",
	"yarl==1.22.0",
]

[project.scripts]
al_export = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
